<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login <Form></Form></title>
</head>
<body style="background-color: #363636; color: #fff;">
    <!--Login Form-->
    <form>
        <h1>Create an account</h1>
        <p>Already have an account? <a href="" style="color: aqua;">Login</a></p>
        <div>
            <div>
                <div>
                    <input type="text" placeholder="First Name" id="firstName" name="First Name">
                    <input type="text" placeholder="Last Name" id="lastName" name="Last Name">
                </div>
            </div>
            <div>
                <input type="email" placeholder="Email" id="email" name="Email">
            </div>
            <div>
                <input type="password" placeholder="Enter your password" id="password">
            </div>
            <div>
                <input type="checkbox" id="box">
                <p>I agree to <a href="" style="color: aqua;">Terms & Conditions</a></p>
            </div>
            <button type="button" id="btn-submit" disabled >Submit</button>
        </div>
    </form>
    <script src="script.js"></script>
</body>
</html>
